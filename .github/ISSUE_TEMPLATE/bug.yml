name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets or personal data. Report vulnerabilities through the security policy, not here.
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the Letterboxd list or username if relevant, and the browser.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
